<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#fff4df" />
  <title>말랑팡</title>
  <meta name="description" content="꾹 눌러 발사하고 같은 젤리를 합치는 말랑한 물리 머지 게임" />
  <style>
    
    :root{--ink:#352c45;--cream:#fff7e8;--purple:#7c68d9;--pink:#ff78a4;--mint:#72d9bb}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;overflow:hidden}
    body{font-family:'Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 10%,#fffdf7 0 15%,transparent 40%),linear-gradient(145deg,#fff1d7,#fce1e9 55%,#e9e1ff);touch-action:none}
    body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none}
    body:before{width:280px;height:280px;background:#ffd36e;left:-120px;bottom:-90px}body:after{width:240px;height:240px;background:#95e7d0;right:-100px;top:-80px}
    .app{height:100dvh;max-width:1050px;margin:auto;display:grid;grid-template-columns:260px minmax(320px,520px) 220px;gap:20px;align-items:center;padding:20px;position:relative}
    .panel{background:rgba(255,255,255,.72);border:2px solid rgba(255,255,255,.9);box-shadow:0 18px 50px rgba(90,65,111,.15);backdrop-filter:blur(12px);border-radius:28px;padding:22px}
    .brand small{display:block;color:#8a7896;font-weight:700;letter-spacing:.18em;margin-bottom:4px}.brand h1{font-family:'Malgun Gothic',sans-serif;font-size:42px;line-height:.95;margin:0;color:#6c55ca;text-shadow:0 4px 0 #fff}.brand h1 span{color:#ff6e9d}
    .scorebox{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff9ef;border-radius:18px;padding:13px}.stat label{display:block;font-size:12px;color:#8e8097;font-weight:700}.stat b{font-family:'Malgun Gothic';font-size:26px;color:#493a64}.stat:first-child b{color:#ef5c91}
    .how{margin-top:22px}.how h2,.next-wrap h2{font-family:'Malgun Gothic';font-size:18px;margin:0 0 10px}.how p{font-size:14px;line-height:1.65;margin:7px 0}.key{display:inline-grid;place-items:center;min-width:28px;height:25px;padding:0 8px;background:white;border-radius:8px;box-shadow:0 3px 0 #ded3e9;font-weight:700;font-size:12px}
    .sound{margin-top:18px;border:0;background:#ebe5fb;color:#654fae;border-radius:99px;padding:10px 14px;font:700 13px inherit;cursor:pointer}
    .game-shell{position:relative;height:min(88dvh,780px);min-height:520px;background:rgba(255,255,255,.4);border-radius:40px;padding:10px;box-shadow:0 28px 70px rgba(80,54,104,.2),inset 0 0 0 2px rgba(255,255,255,.8)}
    canvas{width:100%;height:100%;display:block;border-radius:32px;background:linear-gradient(#fffdf8,#fff5e7);cursor:crosshair}
    .top-actions{position:absolute;top:22px;right:22px;display:flex;gap:8px}.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:rgba(255,255,255,.86);color:#695987;font-size:18px;box-shadow:0 6px 18px rgba(71,49,92,.12);cursor:pointer}
    .power{position:absolute;left:28px;right:28px;bottom:25px;height:12px;border-radius:99px;background:#eadff0;overflow:hidden;pointer-events:none}.power i{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#79dabf,#ffd166,#ff6f91);transition:width .04s linear}
    .right{display:flex;flex-direction:column;gap:16px}.next-wrap{text-align:center}.next-blob{height:126px;display:grid;place-items:center;background:#fff9ee;border-radius:24px;position:relative;overflow:hidden}.next-blob:after{content:"다음";position:absolute;bottom:8px;font-size:11px;color:#9a8fa2;letter-spacing:.15em;font-weight:bold}
    .preview{width:58px;height:58px;border-radius:48% 52% 49% 51%;background:#ff82aa;box-shadow:inset -8px -10px 0 rgba(80,30,90,.08),0 8px 0 rgba(80,30,90,.08);position:relative;transition:.2s;display:grid;place-items:center;font-family:'Malgun Gothic';font-size:18px;color:#493a58}
    .goal{font-size:14px;line-height:1.6;color:#675c70}.goal strong{color:#ee5e91}.footer-note{font-size:11px;color:#9b8ea4;text-align:center}
    .overlay{position:absolute;inset:10px;border-radius:32px;background:rgba(255,248,239,.9);backdrop-filter:blur(8px);display:none;place-items:center;text-align:center;z-index:5}.overlay.show{display:grid}.overlay h2{font-family:'Malgun Gothic';font-size:42px;color:#6b55ca;margin:0}.overlay p{line-height:1.6}.primary{border:0;border-radius:16px;background:linear-gradient(135deg,#7f68db,#ef6fa0);color:white;font:700 16px inherit;padding:14px 24px;box-shadow:0 8px 0 #5d489f;cursor:pointer}.primary:active{transform:translateY(4px);box-shadow:0 4px 0 #5d489f}
    .toast{position:absolute;left:50%;top:25%;transform:translate(-50%,-10px);font-family:'Malgun Gothic';font-size:24px;color:#ef5f91;opacity:0;pointer-events:none;text-shadow:0 2px white;transition:.25s}.toast.pop{animation:toast .7s ease-out}@keyframes toast{20%{opacity:1;transform:translate(-50%,-35px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px)}}
    @media(max-width:820px){body{overflow:auto}.app{height:100dvh;grid-template-columns:1fr;padding:10px}.left,.right{position:absolute;z-index:3;background:transparent;border:0;box-shadow:none;backdrop-filter:none;padding:0}.left{left:28px;top:25px}.right{right:26px;top:78px}.brand small,.how,.sound,.goal,.footer-note,.next-wrap h2{display:none}.brand h1{font-size:25px}.scorebox{margin-top:8px}.stat{padding:7px 10px;background:rgba(255,255,255,.8)}.stat label{font-size:10px}.stat b{font-size:19px}.next-wrap{padding:0}.next-blob{width:70px;height:82px;background:rgba(255,255,255,.75);border-radius:18px}.preview{transform:scale(.65)}.game-shell{height:calc(100dvh - 20px);min-height:0;border-radius:32px}.top-actions{top:20px;right:18px}.power{bottom:20px}}
  </style>
</head>
<body>
<main class="app">
  <aside class="panel left">
    <div class="brand"><small>SQUISHY MERGE</small><h1>말랑<span>팡</span></h1></div>
    <div class="scorebox"><div class="stat"><label>점수</label><b id="score">0</b></div><div class="stat"><label>최고</label><b id="best">0</b></div></div>
    <div class="how"><h2>키보드로 해요</h2><p><span class="key">방향키</span> 조준점을 움직여요</p><p><span class="key">SPACE</span> 꾹 눌러 힘을 모아 발사!</p><p>강하게 쏘면 더 크게 찌그러지고<br>주변 말랑이를 세게 밀어내요.</p></div>
    <button class="sound" id="sound">🔊 소리 켜짐</button>
  </aside>
  <section class="game-shell">
    <canvas id="game" aria-label="말랑팡 게임"></canvas>
    <div class="top-actions"><button class="icon-btn" id="pause" aria-label="일시정지">Ⅱ</button><button class="icon-btn" id="restart" aria-label="다시 시작">↻</button></div>
    <div class="power"><i id="powerbar"></i></div><div class="toast" id="toast">말랑팡!</div>
    <div class="overlay" id="overlay"><div><h2 id="over-title">잠깐!</h2><p id="over-copy">쉬었다 해도 괜찮아요.</p><button class="primary" id="resume">계속하기</button></div></div>
  </section>
  <aside class="right">
    <div class="panel next-wrap"><h2>다음 젤리</h2><div class="next-blob"><div class="preview" id="preview"></div></div></div>
    <div class="panel goal"><strong>오늘의 목표</strong><br>512부터 등장하는<br>한화오션 젤리를 만들어요!</div><div class="footer-note">비공식 팬 게임 · 로고 © Hanwha Ocean</div>
  </aside>
</main>

    balls=balls.filter(b=>!b.dead);for(const b of balls){if(b.y+b.r>=H-14-.5)contact(b,Math.PI/2,.16);if(b.x-b.r<=arena.l+.5)contact(b,Math.PI,.13);if(b.x+b.r>=arena.r-.5)contact(b,0,.13);settleSoft(b,dt)}updateScore();for(const p of particles){p.life-=dt;p.vy+=190*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}particles=particles.filter(p=>p.life>0);for(const b of bursts){b.life-=dt*.65;b.scale+=dt*1.2}bursts=bursts.filter(b=>b.life>0);
    const danger=balls.some(b=>b.age>1.1&&b.y-b.r<138);overflow=danger?overflow+dt:Math.max(0,overflow-dt);if(overflow>1.35)gameOver()}
  function pathBlob(b){const s=softOf(b),pts=[];for(let i=0;i<N;i++){const a=i/N*Math.PI*2,r=b.r*(1+s.d[i]);pts.push([Math.cos(a)*r,Math.sin(a)*r])}ctx.beginPath();ctx.moveTo((pts[N-1][0]+pts[0][0])/2,(pts[N-1][1]+pts[0][1])/2);for(let i=0;i<N;i++){const next=pts[(i+1)%N];ctx.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+next[0])/2,(pts[i][1]+next[1])/2)}ctx.closePath()}
  function blob(b,ready=false){ctx.save();ctx.translate(b.x,b.y);const col=colors[b.level%colors.length],grad=ctx.createRadialGradient(-b.r*.38,-b.r*.43,1,0,0,b.r*1.18);grad.addColorStop(0,'#fff');grad.addColorStop(.13,shade(col,.15));grad.addColorStop(.42,col);grad.addColorStop(.8,col);grad.addColorStop(1,shade(col,-.22));ctx.fillStyle=grad;ctx.shadowColor='rgba(52,34,72,.24)';ctx.shadowBlur=14;ctx.shadowOffsetY=8;pathBlob(b);ctx.fill();ctx.shadowColor='transparent';ctx.globalAlpha=.38;ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineWidth=Math.max(2,b.r*.09);ctx.beginPath();ctx.arc(-b.r*.18,-b.r*.2,b.r*.52,3.7,5.08);ctx.stroke();ctx.globalAlpha=.16;ctx.lineWidth=Math.max(1,b.r*.045);ctx.beginPath();ctx.arc(b.r*.1,b.r*.08,b.r*.72,.05,1.45);ctx.stroke();ctx.globalAlpha=1;
    const val=valueOf(b.level);if(val>=512&&logo.complete){const w=b.r*1.48,h=w*.36;ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,h/2);ctx.fill();ctx.drawImage(logo,105,160,590,130,-w*.44,-h*.34,w*.88,h*.68)}else{ctx.fillStyle='#44384f';ctx.font=`${Math.max(12,b.r*.48)}px Jua`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(val,0,1)}ctx.restore()}
  function shade(hex,p){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v*(1+p)))).toString(16).padStart(2,'0')).join('')}
  function arrow(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle='rgba(105,79,155,.65)';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=3;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-13*Math.cos(a-.55),y2-13*Math.sin(a-.55));ctx.lineTo(x2-13*Math.cos(a+.55),y2-13*Math.sin(a+.55));ctx.fill()}
  function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>.05)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.84;ctx.fillStyle='#eee4f2';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff8eb';ctx.fillRect(arena.l,0,arena.r-arena.l,H);ctx.strokeStyle='rgba(90,65,115,.2)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(arena.l,0);ctx.lineTo(arena.l,H);ctx.moveTo(arena.r,0);ctx.lineTo(arena.r,H);ctx.stroke();ctx.strokeStyle='rgba(101,75,125,.1)';ctx.lineWidth=2;for(let y=165;y<H;y+=54){ctx.beginPath();ctx.moveTo(arena.l+2,y);ctx.lineTo(arena.r-2,y);ctx.stroke()}ctx.setLineDash([7,9]);ctx.strokeStyle=overflow>0?'rgba(239,85,127,.85)':'rgba(239,100,140,.3)';ctx.beginPath();ctx.moveTo(arena.l+2,138);ctx.lineTo(arena.r-2,138);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(231,99,139,.65)';ctx.font='12px Gowun Dodum';ctx.fillText('넘치면 안 돼요!',arena.l+12,130);
    const ready={x:launcher.x,y:launcher.y,r:radii[next],level:next,wobble:(dragging||spaceCharging)?.65:.2,deform:(dragging||spaceCharging)?charge*.32:.03,deformAngle:Math.atan2(target.y-launcher.y,target.x-launcher.x),phase:1};if(dragging){const dx=launcher.x-pointer.x,dy=launcher.y-pointer.y,len=Math.hypot(dx,dy),m=Math.min(len,145)/(len||1);ready.x=launcher.x-dx*m*.18;ready.y=launcher.y-dy*m*.18;ready.deform=Math.min(.38,len/380);ready.deformAngle=Math.atan2(dy,dx);arrow(launcher.x,launcher.y,launcher.x+dx*m*1.45,launcher.y+dy*m*1.45)}else{const dx=target.x-launcher.x,dy=target.y-launcher.y,len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len;if(spaceCharging){ready.x-=nx*charge*24;ready.y-=ny*charge*24}arrow(launcher.x,launcher.y,launcher.x+nx*(82+charge*90),launcher.y+ny*(82+charge*90));ctx.strokeStyle='rgba(238,94,145,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(target.x,target.y,9,0,7);ctx.moveTo(target.x-14,target.y);ctx.lineTo(target.x+14,target.y);ctx.moveTo(target.x,target.y-14);ctx.lineTo(target.x,target.y+14);ctx.stroke()}blob(ready,true);
    balls.sort((a,b)=>a.r-b.r);for(const b of balls)blob(b);for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3+p.life*4,0,7);ctx.fill()}for(const b of bursts){ctx.globalAlpha=Math.max(0,b.life);const w=190*b.scale,h=w*.36;ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.roundRect(b.x-w/2,b.y-h/2,w,h,h/2);ctx.fill();if(logo.complete)ctx.drawImage(logo,105,160,590,130,b.x-w*.44,b.y-h*.34,w*.88,h*.68)}ctx.globalAlpha=1;ctx.restore()}
  function loop(t){const dt=Math.min(.025,(t-last)/1000||.016);last=t;if(!paused&&!ended){const move=260*dt;if(keys.has('ArrowLeft'))target.x-=move;if(keys.has('ArrowRight'))target.x+=move;if(keys.has('ArrowUp'))target.y-=move;if(keys.has('ArrowDown'))target.y+=move;target.x=Math.max(arena.l+20,Math.min(arena.r-20,target.x));target.y=Math.max(175,Math.min(H-70,target.y));if(spaceCharging){charge=Math.min(1,(performance.now()-chargeAt)/1000);powerbar.style.width=(charge*100)+'%'}physics(dt)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
  function point(e){const r=c.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top}
  c.addEventListener('pointerdown',e=>{point(e);if(paused||ended)return;dragging=true;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{point(e);if(dragging){const len=Math.min(145,Math.hypot(launcher.x-pointer.x,launcher.y-pointer.y));charge=len/145;powerbar.style.width=(charge*100)+'%'}});c.addEventListener('pointerup',e=>{if(!dragging)return;point(e);launchPointer()});c.addEventListener('pointercancel',()=>{dragging=false;charge=0;powerbar.style.width='0'});
  function showPause(){paused=true;overTitle.textContent='잠깐!';overCopy.textContent='말랑이들도 잠깐 쉬고 있어요.';resume.textContent='계속하기';overlay.classList.add('show')}
  function gameOver(){ended=true;overTitle.textContent='가득 찼어요!';overCopy.innerHTML=`이번 점수 <b>${score.toLocaleString()}</b>점`;resume.textContent='다시 도전';overlay.classList.add('show');tone(130,.35,'sawtooth',.04)}
  document.querySelector('#pause').onclick=()=>paused?null:showPause();document.querySelector('#restart').onclick=reset;resume.onclick=()=>{if(ended)reset();else{paused=false;overlay.classList.remove('show')}};document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 소리 켜짐':'🔇 소리 꺼짐'};document.addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();keys.add(e.code);const n=18;if(e.code==='ArrowLeft')target.x-=n;if(e.code==='ArrowRight')target.x+=n;if(e.code==='ArrowUp')target.y-=n;if(e.code==='ArrowDown')target.y+=n;if(e.code==='Space'&&!spaceCharging&&!e.repeat&&!paused&&!ended){spaceCharging=true;chargeAt=performance.now();charge=0}if(e.code==='Escape'&&!paused)showPause()});document.addEventListener('keyup',e=>{keys.delete(e.code);if(e.code==='Space'&&spaceCharging){e.preventDefault();launchKeyboard()}});window.addEventListener('blur',()=>{keys.clear();spaceCharging=false;charge=0;powerbar.style.width='0'});reset();
